mutation createBlogPost($title: String!, $input: BlogPostInput!) {
  blogMutations {
    createBlogPost(title: $title, input: $input) {
      message
      post {
        id
        title
        content
        tags
        remoteObject
        language
        parentId
        type {
          id
          name
        }
        createdAt
        updatedAt
      }
    }
  }
}
