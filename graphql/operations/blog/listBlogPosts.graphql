query listBlogPosts($pagination: PaginationInput) {
  blogQueries {
    listBlogPosts(pagination: $pagination) {
      items {
        id
        title
        content
        tags
        remoteObject
        language
        parentId
        type {
          id
          name
        }
        createdAt
        updatedAt
      }
      pageInfo {
        page
        size
        totalPages
        totalCount
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
